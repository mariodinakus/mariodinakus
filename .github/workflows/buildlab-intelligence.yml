name: Refresh Build Lab intelligence
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: buildlab-intelligence
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_dashboard.py
      - name: Commit public source snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/live-data.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Build Lab source snapshots"
          git pull --rebase origin main
          git push origin HEAD:main
